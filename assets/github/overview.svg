<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Traverce architecture overview</title>
  <desc id="desc">Traverce routes supported services through zapret2, Smart DNS or a local Telegram proxy without a system-wide VPN.</desc>
  <rect width="1200" height="420" rx="28" fill="#0d1117"/>
  <text x="64" y="72" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Traverce</text>
  <text x="64" y="108" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Точечный доступ без системного VPN</text>

  <rect x="64" y="150" width="300" height="196" rx="22" fill="#161b22" stroke="#30363d"/>
  <circle cx="100" cy="190" r="14" fill="#2f81f7"/>
  <text x="128" y="198" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">DPI</text>
  <text x="92" y="242" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">YouTube · Discord</text>
  <text x="92" y="280" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">zapret2 + WinDivert</text>
  <text x="92" y="312" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Стратегия подбирается</text>
  <text x="92" y="334" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">и запоминается по сети</text>

  <rect x="450" y="150" width="300" height="196" rx="22" fill="#161b22" stroke="#30363d"/>
  <circle cx="486" cy="190" r="14" fill="#3fb950"/>
  <text x="514" y="198" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">Smart DNS</text>
  <text x="478" y="242" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">ChatGPT · Gemini · Claude</text>
  <text x="478" y="280" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Windows NRPT rules</text>
  <text x="478" y="312" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Только выбранные домены</text>
  <text x="478" y="334" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">остальной трафик — напрямую</text>

  <rect x="836" y="150" width="300" height="196" rx="22" fill="#161b22" stroke="#30363d"/>
  <circle cx="872" cy="190" r="14" fill="#d29922"/>
  <text x="900" y="198" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">Telegram</text>
  <text x="864" y="242" fill="#c9d1d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Telegram Desktop</text>
  <text x="864" y="280" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Local MTProto-over-WS</text>
  <text x="864" y="312" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Локальный proxy</text>
  <text x="864" y="334" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">без общего туннеля</text>

  <path d="M364 248 H430" stroke="#30363d" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M750 248 H816" stroke="#30363d" stroke-width="2" stroke-dasharray="6 8"/>
</svg>
